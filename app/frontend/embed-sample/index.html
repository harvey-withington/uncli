<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>&lt;uncli-chat&gt; sample host</title>
  <style>
    /* A host page with its own look, including names UNCLI uses itself
       (--bg, --accent, .btn): none of it should reach the chats, and
       theirs shouldn't reach the page. */
    :root { --bg: #f1efe9; --accent: #0b7a5c; }
    body { margin: 0; font-family: Georgia, 'Times New Roman', serif; background: var(--bg); color: #222; }
    header { display: flex; align-items: center; gap: 16px; padding: 12px 20px; background: #20302b; color: #fff; }
    header h1 { margin: 0; font-size: 18px; font-weight: normal; }
    .btn { padding: 6px 14px; border: 2px solid var(--accent); background: #fff; color: var(--accent); font: inherit; }
    main { display: grid; grid-template-columns: 260px 1fr 1fr 380px; gap: 16px; padding: 16px 20px; }
    figure { margin: 0; min-width: 0; }
    figcaption { margin-bottom: 6px; font-size: 14px; color: #555; }
    uncli-chat, uncli-session-list { height: 640px; }
    uncli-session-list { background: #fbfaf7; border: 1px solid #c9c4b8; border-radius: 8px; }
    uncli-chat { border: 1px solid #c9c4b8; border-radius: 8px; }
    /* The second chat takes the host's accent through UNCLI's public tokens. */
    #second { --uncli-accent: #0b7a5c; }
    /* The host restyles a part of it, and puts its own controls in its slots. */
    #second::part(composer) { border-top: 3px solid #0b7a5c; }
    .host-bit { margin: 4px 16px; padding: 4px 10px; border: 1px dashed #0b7a5c; border-radius: 6px; color: #9fd8c4; font: 13px Georgia, serif; background: none; }
    .host-card { padding: 12px 16px; color: #d9e6e0; font: 14px/1.5 Georgia, serif; }
    .host-card h3 { margin: 0 0 4px; font-size: 16px; }
    .host-card p { margin: 0 0 8px; color: #8fb3a6; }
    #log { margin: 0 20px 20px; font: 13px/1.4 ui-monospace, monospace; color: #555; white-space: pre-wrap; }
  </style>
</head>
<body>
<header>
  <h1>A host app</h1>
  <button class="btn" id="host-btn">The host's own button</button>
  <button class="btn" id="new-chat" hidden>New chat</button>
  <button class="btn" id="review">Review changes</button>
</header>
<main>
  <figure>
    <figcaption>A session list: pick one for the next chat</figcaption>
    <uncli-session-list id="list" selected="s-code" scheme="light"></uncli-session-list>
  </figure>
  <figure>
    <figcaption>The list's session, light, the host's font</figcaption>
    <uncli-chat id="first" session="s-code" scheme="light"></uncli-chat>
  </figure>
  <figure>
    <figcaption>A Chat session, dark, the host's accent, layout remembered under "sample"</figcaption>
    <uncli-chat id="second" session="s-chat" scheme="dark" storage-key="sample">
      <button slot="header-extra" class="host-bit">3 edits waiting for review</button>
      <p slot="below-composer" class="host-bit">The host's own line under the composer</p>
      <section slot="side-tab-card" class="host-card">
        <h3>Lisbon trip</h3>
        <p>Due Friday · 3 of 7 items done</p>
        <ul><li>Book flights</li><li>Pick a hotel</li><li>Travel insurance</li></ul>
      </section>
    </uncli-chat>
  </figure>
  <figure>
    <figcaption>A narrow sidebar: the compact layout, by its width</figcaption>
    <uncli-chat id="third" session="s-cowork"></uncli-chat>
  </figure>
</main>
<pre id="log"></pre>
<script type="module" src="./main.ts"></script>
</body>
</html>
