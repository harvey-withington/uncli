# Built-in profiles. A user profiles.yaml in UNCLI's config folder overrides
# these by id, or adds new ones.
profiles:
  - id: chat
    label: Chat
    icon: message-circle
    hue: 205                 # azure; type icons and accents use HSL(hue, 100%, theme lightness)
    folder: scratch          # scratch | pick | repo; scratch = a fresh folder per session
    model: sonnet
    system_prompt: |         # replaces the coding persona
      You are a helpful assistant in a desktop chat app. Answer in Markdown.
      Put any substantial output (HTML, SVG, Mermaid, long documents) in a
      file under ./artifacts/ and say so in your answer.
    tools: [WebSearch, WebFetch, Write]
    allowed_tools: [WebSearch, WebFetch, "Write(./artifacts/**)"]
    isolated: true           # no user settings, MCP servers or skills: ~2.4k tokens a turn instead of ~26k
    artifacts: true          # ./artifacts/ is versioned per page and shown in the artifact pane
    permission_mode: default
    modifiers_on: []
  - id: cowork
    label: Co-work
    icon: briefcase
    hue: 38                  # amber
    folder: pick
    model: sonnet
    append_prompt: |
      You are helping with documents and knowledge work in this folder.
      Put generated deliverables under ./artifacts/.
    allowed_tools: [Read, Write, Edit, Glob, Grep, WebSearch, WebFetch]
    artifacts: true
    permission_mode: default
  - id: code
    label: Code
    icon: code
    hue: 280                 # violet
    folder: repo
    model: opus
    tools: []                # empty = CLI defaults
    allowed_tools:
      - "Bash(git status:*)"
      - "Bash(git diff:*)"
      - "Bash(git log:*)"
      - "Bash(git show:*)"
      # No stack's commands here: UNCLI judges builds, tests and scripts the
      # same way for every stack (brief: Defaults for every stack). An entry
      # here overrides that judgement, so Bash(npm run:*) would also let
      # npm run deploy run unprompted.
    permission_mode: acceptEdits
    ide_links: true
