name: Idea
description: Something the app could do, or do better.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The job, not the solution. What gets in the way today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
