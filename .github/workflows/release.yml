# Pushing a v* tag builds with `npm run release` and publishes everything it
# leaves in dist/ (the installer, its checksum and the licences) as a GitHub
# release, with CHANGELOG.md's section for the version as the release notes.
# The tag's version, without the v, is passed as RELEASE_VERSION.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v7
        if: hashFiles('**/go.mod') != ''
        with:
          # Go 1.26, as the README says: Wails v2.10.1 fails under Go 1.27
          # ("package embed without types"). Move up together with Wails.
          go-version: "1.26.x"
          cache-dependency-path: '**/go.sum'

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Tools
        shell: pwsh
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.10.1
          choco install nsis -y --no-progress
          echo "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Append

      # The frontend's packages too: the notices check reads their licences.
      - name: npm ci
        run: |
          npm ci
          npm --prefix app/frontend ci

      - name: Build
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          $env:RELEASE_VERSION = $env:RELEASE_VERSION.TrimStart('v')
          npm run release

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: release-notes.md
          # v1.0.0a, v1.0.0b1, v1.0.0-rc1 ... publish as pre-releases
          prerelease: ${{ contains(github.ref_name, 'a') || contains(github.ref_name, 'b') || contains(github.ref_name, 'rc') || contains(github.ref_name, '-') }}
