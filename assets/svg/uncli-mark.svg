<svg xmlns="http://www.w3.org/2000/svg" viewBox="150 118 300 292" width="300" height="292" role="img" aria-label="UNCLI">
  <title>UNCLI</title>
  <!-- Close to square, so the build's icons fill their square with little
       to spare: tucked-in ears and rounded hair set the width and height. -->
  <g stroke="#2A1F1A" stroke-width="8" stroke-linejoin="round" stroke-linecap="round">
    <!-- Ears -->
    <circle cx="178" cy="292" r="24" fill="#F6C9A3"/>
    <circle cx="422" cy="292" r="24" fill="#F6C9A3"/>
    <path d="M182,292 q7,-5 10,4" fill="none" stroke-width="5"/>
    <path d="M418,292 q-7,-5 -10,4" fill="none" stroke-width="5"/>
    <!-- Face -->
    <ellipse cx="300" cy="275" rx="130" ry="128" fill="#F6C9A3"/>
    <!-- Hair: combed back, a mid brown that still shows on a dark taskbar -->
    <path d="M166,270 C156,196 204,126 300,124 C396,126 444,196 434,270 C420,236 398,216 372,206 C332,194 268,194 228,206 C202,216 180,236 166,270 Z" fill="#7A5236"/>
    <path d="M300,132 C282,152 258,168 228,180" fill="none" stroke-width="5"/>
    <path d="M336,140 C322,160 304,174 282,184" fill="none" stroke-width="5"/>
    <!-- Brows and eyes -->
    <path d="M222,234 Q248,214 274,230" fill="none" stroke-width="7"/>
    <path d="M326,230 Q352,214 378,234" fill="none" stroke-width="7"/>
    <circle cx="250" cy="266" r="23" fill="#FFFFFF" stroke-width="6"/>
    <circle cx="350" cy="266" r="23" fill="#FFFFFF" stroke-width="6"/>
    <circle cx="253" cy="269" r="10" fill="#2A1F1A" stroke="none"/>
    <circle cx="347" cy="269" r="10" fill="#2A1F1A" stroke="none"/>
    <circle cx="257" cy="264" r="3.5" fill="#FFFFFF" stroke="none"/>
    <circle cx="351" cy="264" r="3.5" fill="#FFFFFF" stroke="none"/>
    <!-- Cheeks and nose -->
    <circle cx="214" cy="304" r="15" fill="#E8816B" stroke="none" opacity="0.55"/>
    <circle cx="386" cy="304" r="15" fill="#E8816B" stroke="none" opacity="0.55"/>
    <ellipse cx="300" cy="300" rx="18" ry="15" fill="#F6C9A3" stroke-width="6"/>
    <!-- The handlebar moustache, its two halves mirrored -->
    <path d="M300,318 C280,300 240,300 215,312 C200,318 192,312 192,300 C192,290 186,284 180,282 C168,290 164,312 176,326 C190,342 230,350 262,344 C282,340 294,336 300,338 Z" fill="#3B2A20" stroke-width="7"/>
    <path d="M300,318 C320,300 360,300 385,312 C400,318 408,312 408,300 C408,290 414,284 420,282 C432,290 436,312 424,326 C410,342 370,350 338,344 C318,340 306,336 300,338 Z" fill="#3B2A20" stroke-width="7"/>
    <!-- Smile -->
    <path d="M286,372 q14,10 28,0" fill="none" stroke-width="6"/>
  </g>
</svg>
